[project]
name = "ms2exp"
version = "0.1.0"
description = "Reproducibility companion for the ms2 matching-statistics paper"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The versions the paper's figures were drawn with.
figures = ["matplotlib==3.11.2", "numpy==2.5.3", "pillow==12.3.0", "fonttools==4.66.0", "contourpy==1.4.0",
           "cycler==0.12.1", "kiwisolver==1.5.1", "packaging==26.3", "pyparsing==3.3.3",
           "python-dateutil==2.9.0.post0", "six==1.17.0"]
test = ["pytest", "pyflakes"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ms2exp*"]

[tool.setuptools.package-data]
"ms2exp.build" = ["ms_check.cpp", "build_legacy.sh"]
